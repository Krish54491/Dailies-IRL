<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dailies IRL</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="brand">
      <img src="Dailies IRL Logo.png" alt="" width="36" height="36" />
      <div>
        <h1>Dailies IRL</h1>
        <p>Random quests for real life</p>
      </div>
    </header>

    <div class="actions">
      <button id="settings" class="primary">Settings</button>
      <a
        id="tasks"
        class="button"
        href="https://tasks.google.com/"
        target="_blank"
        rel="noopener"
      >
        Open Google Tasks
      </a>
    </div>

    <fieldset class="theme">
      <legend>Theme</legend>
      <label
        ><input type="radio" name="theme" value="system" /><span
          >System</span
        ></label
      >
      <label
        ><input type="radio" name="theme" value="light" /><span
          >Light</span
        ></label
      >
      <label
        ><input type="radio" name="theme" value="dark" /><span
          >Dark</span
        ></label
      >
    </fieldset>

    <!-- <details>
      <summary>Testing</summary>
      <button id="ping">Ping</button>
      <button id="run">Run scheduler now</button>
      <button id="reset">Reset runs</button>
      <pre id="out"></pre>
    </details> -->
    <script src="api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
